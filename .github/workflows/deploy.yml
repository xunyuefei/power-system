name: Deploy VitePress site to Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: power-system-web/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        working-directory: power-system-web
        run: npm ci || npm install

      - name: Build with VitePress
        working-directory: power-system-web
        run: npm run docs:build

      - name: Copy Quiz App to Pages dist
        run: cp -r power-system-quiz power-system-web/docs/.vitepress/dist/quiz

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: power-system-web/docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
