<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.74  0 0 0 0 0.97  0 0 0 0.8 0" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="8"/>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="256" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>

  <!-- Grid Circuit Lines (Power System Flavor) -->
  <g stroke="#38bdf8" stroke-width="3" opacity="0.28" stroke-linecap="round">
    <!-- Horizontal & Vertical Busbars -->
    <line x1="80" y1="180" x2="200" y2="180" />
    <circle cx="200" cy="180" r="5" fill="#38bdf8" />
    <line x1="312" y1="180" x2="432" y2="180" />
    <circle cx="312" cy="180" r="5" fill="#38bdf8" />

    <line x1="80" y1="332" x2="200" y2="332" />
    <circle cx="200" cy="332" r="5" fill="#38bdf8" />
    <line x1="312" y1="332" x2="432" y2="332" />
    <circle cx="312" cy="332" r="5" fill="#38bdf8" />

    <!-- Vertical Lines -->
    <line x1="256" y1="72" x2="256" y2="140" stroke-dasharray="6 6"/>
    <line x1="256" y1="372" x2="256" y2="440" stroke-dasharray="6 6"/>
  </g>

  <!-- Central High-Voltage Transformer Nodes -->
  <g stroke="#818cf8" stroke-width="4" fill="none" opacity="0.45">
    <circle cx="200" cy="256" r="32" />
    <circle cx="312" cy="256" r="32" />
  </g>

  <!-- Core Lightning Bolt Symbol -->
  <path d="M 276 96
           L 172 264
           L 248 264
           L 224 416
           L 344 236
           L 268 236
           Z"
        fill="url(#boltGrad)"
        filter="url(#boltGlow)"
        stroke="#ffffff"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Spark Accent Dots -->
  <circle cx="356" cy="220" r="6" fill="#fef08a" opacity="0.9"/>
  <circle cx="160" cy="276" r="4" fill="#38bdf8" opacity="0.8"/>
  <circle cx="236" cy="426" r="5" fill="#67e8f9" opacity="0.9"/>
</svg>
